<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>smart stream</title>
</head>

<body class="flex flex-col  lg:grid grid-cols-12 grid-rows-10 h-screen">
    <header
        class="flex justify-between items-center col-start-1 col-end-13 border bg-gradient-to-r from-[#080808] to-[#FF1010] border-solid">
        <a href="index.html"><img src="assest/dodrarstreamlogo.png" alt="" class="h-15 pl-5"></a>
        <div class="pr-8">
            <button title="ajoute channel"><img src="assest/add.svg" alt="ajoute channel" class="h-12" ></button>

            <button title="blacklist-btn"><img src="assest/report-white.svg" alt="blacklist-btn" class="h-12" id="blacklist-btn"></button>
        </div>
    </header>
    <main
        class=" flex flex-col gap-5 lg:grid lg:grid-cols-12 lg:grid-rows-14 row-start-2 row-end-11 col-span-12 overflow-auto bg-black">
        <section class="flex gap-11 items-center  row-start-2  col-start-1 col-end-6">
            <button id="btn-remove"
                class="h-12 w-12 bg-[url(/assest/right_panel.svg)] bg-center bg-no-repeat bg-contain"></button>

            <input type="search" name="search" id="search-search" placeholder="Recherche"
                class="pl-10 h-10 w-full mr-5 bg-amber-50 rounded-2xl bg-[url('/assest/search.svg')] bg-left bg-size-[1.5rem]  bg-no-repeat bg-contain">
        </section>

        <aside class="bg-[#080808] border h-[50%] lg:h-auto lg:col-start-1 lg:col-end-6 lg:row-start-3 lg:row-span-20 ">
            <span id="loading-search" class=""></span>
            <!-- <p class="text-amber-50 text-2xl text-center">Chargement... </p> -->
            <ul id="channel-space" class="overflow-auto h-full">

            </ul>

        </aside>

        <aside id="space-catregory"
            class="bg-gradient-to-l from-[#080808] to-[#FF1010] hidden  lg:border-amber-50 border h-[50%] lg:h-auto lg:col-start-1 lg:col-end-4 lg:row-start-3 lg:row-span-20  ">
            <ul id="category-place" class="overflow-scroll h-full">
                <li class="text-2xl text-amber-50 border-amber-50 border text-center" id="tout">tout</li>
                <li class="text-2xl text-amber-50 border-amber-50 border flex justify-center gap-4  text-center" id="Favorite">Favorite<img id="img-favor" src="assest/star-fill.svg" alt=""></li>
            </ul>
        </aside>

        <div
            class="flex justify-center items-center bg-[#080808] w-full h-64 sm:h-88 lg:h-full lg:row-start-2 lg:row-span-13 lg:col-start-6 lg:col-end-13">
            <div id="show-place"
                class="flex items-center justify-center rounded-2xl  border border-[#FF1010] w-[95%] h-full ">
                <span id="spin" class=""></span>
                <!-- <img src="assest/banner.png" alt="" class="w-full h-full rounded-2xl "> -->
                <video id="videoPlayer" src="" controls class="w-full h-full rounded-2xl"></video>
            </div>
        </div>
        <div id="detais-space"
            class="flex justify-around font- text-amber-50 font-montserrat font-bold  bg-[#080808] col-start-6 col-end-13 row-start-15  row-span-10">

        </div>
        <div id="space" class="absolute bg-white/30 backdrop-blur-sm h-[90%] w-[50%] left-0  hidden"></div>
        <div id="popUp" class="absolute bg-black right-0 h-[90%] w-[50%] hidden ">
            <ul id="popUp-list" class="overflow-auto h-full">

            </ul>
        </div>
        <div class="bg-amber-50 absolute flex flex-col h-[70%] w-[50%] justify-center left-80 top-44 ">
            <h2 class="text-center font-['Roboto']">Ajoute nouveau channel</h2>
            <form action="" class="flex flex-col items-center font-['Roboto'] gap-4 ">
                <label for="name" >Nom</label>
                <input type="text" id="name" class="bg-cyan-200 h-12 w-[70%] ">
                <label for="category">category</label>
                <input type="text" id="category" class="bg-cyan-200 h-12 w-[70%]">
                <label for="numero">numéro</label>
                <input type="number" id="numero" class="bg-cyan-200 h-12 w-[70%]">
                <label for="logo">URL Logo</label>
                <input type="text " id="logo" class="bg-cyan-200 h-12 w-[70%]">
                <button id="btn-submit" class="bg-[#FF1010] h-10 w-[35%]">Ajoute</button>
            </form>
        </div>
    </main>
    <footer></footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="module" src="js/main.js"></script>

</html>
